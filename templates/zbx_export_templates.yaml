              priority: WARNING
              tags:
                - tag: scope
                  value: performance
        - uuid: f90b6ed6dde64f57a76c2d76d049675f
          name: 'DSL: FEC errors (near)'
          type: TRAP
          key: fritzbox.dsl.fec_errors
          tags:
            - tag: component
              value: dsl
        - uuid: 1ba4666e85214662a69dc5b253d51127
          name: 'DSL: Status'
          type: TRAP
          key: fritzbox.dsl.status
          value_type: TEXT
          tags:
            - tag: component
              value: dsl
          triggers:
            - uuid: 539015c5448747599d0ea0795fe8e76b
              expression: 'last(/AVM FritzBox TR-064/fritzbox.dsl.status)<>"Up"'
              name: 'FritzBox: DSL link not up ({ITEM.LASTVALUE}) for {HOST.NAME}'
              priority: HIGH
              dependencies:
                - name: 'FritzBox: WAN disconnected for {HOST.NAME}'
                  expression: 'last(/AVM FritzBox TR-064/fritzbox.wan.is_connected)=0'
