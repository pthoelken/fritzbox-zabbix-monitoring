zabbix_export:
  version: '7.4'
  template_groups:
    - uuid: b24a0dd18d354ea5b490164a51b6a2a8
      name: 'Templates/Network devices'
  templates:
    - uuid: 565e73dca5ee4661a526ed217474dafc
      template: 'AVM FritzBox TR-064'
      name: 'AVM FritzBox TR-064'
      description: |
        Comprehensive monitoring for AVM Fritz!Box via TR-064, LUA, and Callmonitor.
        https://github.com/pthoelken/fritzbox-zabbix-monitoring
      groups:
        - name: 'Templates/Network devices'
      items:
        - uuid: bb888838ad234515804879f0df102976
          name: 'Callmon: Available'
          type: TRAP
          key: fritzbox.callmon.available
          description: '1=connected. Activate: dial #96*5*'
          tags:
            - tag: component
              value: callmonitor
        - uuid: 362992549357487db9d3183f357e7237
          name: 'Callmon: Active calls'
          type: TRAP
          key: fritzbox.callmon.current_active
          tags:
            - tag: component
              value: callmonitor
        - uuid: d2bd9de3fadc4063a9eaa878c08097b5
          name: 'Callmon: Last called'
          type: TRAP
          key: fritzbox.callmon.last_called
          value_type: TEXT
          tags:
            - tag: component
              value: callmonitor
        - uuid: 405bc51e1c4d4725a1ace6e1438f1919
          name: 'Callmon: Last caller'
          type: TRAP
          key: fritzbox.callmon.last_caller
          value_type: TEXT
          tags:
            - tag: component
              value: callmonitor
        - uuid: f4477d3da2fd49b2bfa6c39e21766542
          name: 'Callmon: Last event'
          type: TRAP
          key: fritzbox.callmon.last_event_type
          value_type: TEXT
          tags:
            - tag: component
              value: callmonitor
        - uuid: 150ee0bbd96449cba4374df4449fb1bc
          name: 'Callmon: Total answered'
          type: TRAP
          key: fritzbox.callmon.total_answered
          tags:
            - tag: component
              value: callmonitor
        - uuid: 550baa33ec714765a6d27c27ff42d86c
          name: 'Callmon: Total incoming'
          type: TRAP
          key: fritzbox.callmon.total_incoming
          tags:
            - tag: component
              value: callmonitor
        - uuid: 5eb22aa8fa0c4284a7f9fe09a653c26e
          name: 'Callmon: Total missed'
          type: TRAP
          key: fritzbox.callmon.total_missed
          tags:
            - tag: component
              value: callmonitor
          triggers:
            - uuid: d4958e9baa2c4d36b72ca0582a8e29ec
              expression: 'change(/AVM FritzBox TR-064/fritzbox.callmon.total_missed)>0'
              name: 'FritzBox: Missed call'
              priority: INFO
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: notice
        - uuid: 074994613678428b91c934e33a3d02c7
          name: 'Callmon: Total outgoing'
          type: TRAP
          key: fritzbox.callmon.total_outgoing
          tags:
            - tag: component
              value: callmonitor
        - uuid: 1eed1ef0c5544177ba5085b1ca8f537a
          name: 'Collector: Status'
          type: TRAP
          key: fritzbox.collector.status
          tags:
            - tag: component
              value: collector
          triggers:
            - uuid: 70ea5f4c7a87425b9473225afc5333b1
              expression: 'last(/AVM FritzBox TR-064/fritzbox.collector.status)=0'
              name: 'FritzBox: Collector cannot reach device'
              priority: HIGH
              tags:
                - tag: scope
                  value: availability
            - uuid: 74680f1d25a74929a5b0f23af36ecb08
              expression: 'nodata(/AVM FritzBox TR-064/fritzbox.collector.status,300)=1'
              name: 'FritzBox: No data received for 5 minutes for {HOST.NAME}'
              priority: HIGH
              tags:
                - tag: scope
                  value: availability
        - uuid: 3259dd4670114bc3981410983bc721d2
          name: 'Collector: Timestamp'
          type: TRAP
          key: fritzbox.collector.timestamp
          units: unixtime
          tags:
            - tag: component
              value: collector
        - uuid: 1abdf7a780c6448e811eef0a572a4112
