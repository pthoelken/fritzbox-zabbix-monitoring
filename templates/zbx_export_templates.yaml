zabbix_export:
  version: '7.4'
  template_groups:
    - uuid: b24a0dd18d354ea5b490164a51b6a2a8
      name: 'Templates/Network devices'
  templates:
    - uuid: 565e73dca5ee4661a526ed217474dafc
      template: 'AVM FritzBox TR-064'
      name: 'AVM FritzBox TR-064'
      description: |
        Comprehensive monitoring for AVM Fritz!Box via TR-064, LUA, and Callmonitor.
        https://github.com/pthoelken/fritzbox-zabbix-monitoring
      groups:
        - name: 'Templates/Network devices'
      items:
        - uuid: bb888838ad234515804879f0df102976
          name: 'Callmon: Available'
          type: TRAP
          key: fritzbox.callmon.available
          description: '1=connected. Activate: dial #96*5*'
          tags:
            - tag: component
              value: callmonitor
        - uuid: 362992549357487db9d3183f357e7237
          name: 'Callmon: Active calls'
          type: TRAP
          key: fritzbox.callmon.current_active
          tags:
