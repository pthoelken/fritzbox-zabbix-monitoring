          type: TRAP
          key: fritzbox.device.model
          value_type: TEXT
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - '86400'
          tags:
            - tag: component
              value: device
        - uuid: 4b4dae75ba434824965b62748028929a
          name: 'Device: Serial'
          type: TRAP
          key: fritzbox.device.serial
          value_type: TEXT
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - '86400'
          tags:
            - tag: component
              value: device
        - uuid: 578d0b0d7a5f4dada2fd883c40dc5003
          name: 'Device: Uptime'
          type: TRAP
          key: fritzbox.device.uptime
          units: s
          tags:
            - tag: component
              value: device
          triggers:
            - uuid: 99b85b81ec0b493fa57c8c10d36822eb
              expression: 'last(/AVM FritzBox TR-064/fritzbox.device.uptime)<{$FRITZBOX.UPTIME.MIN}'
              name: 'FritzBox: Device recently rebooted'
              priority: WARNING
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: notice
        - uuid: 7985ddbcaf954215872ad59549cf102a
          name: 'DSL: CRC errors (near)'
