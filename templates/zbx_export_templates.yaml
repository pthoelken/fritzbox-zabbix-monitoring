          key: fritzbox.wlan.guest.standard
          value_type: TEXT
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - '3600'
          tags:
            - tag: component
              value: wlan
        - uuid: dc000051e5f64abc8def000000000051
          name: 'WLAN Guest: Status'
          type: TRAP
          key: fritzbox.wlan.guest.status
          value_type: TEXT
          tags:
            - tag: component
              value: wlan
        - uuid: f2f994b81bd248efbc560a40f7c6512d
          name: 'WLAN Guest: Clients'
          type: TRAP
          key: fritzbox.wlan.guest.total_associations
          tags:
            - tag: component
              value: wlan
      discovery_rules:
        - uuid: a1b2c3d4e5f64a7b8c9d0e1f2a3b4c5d
          name: 'Network Devices Discovery'
          type: TRAP
          key: fritzbox.netdev.discovery
          lifetime: 30d
          description: 'Discovers active network devices from Fritz!Box LUA interface'
          item_prototypes:
            - uuid: f6a7b8c9d0e14f2abc4c5d6e7f8a9b0c
              name: 'Device [{#DEVNAME}]: WLAN Band'
              type: TRAP
              key: 'fritzbox.netdev[{#DEVNAME},band]'
              value_type: TEXT
              description: 'WLAN frequency band (e.g. 2.4 GHz or 5 GHz, WLAN devices only)'
              tags:
                - tag: component
                  value: netdev
                - tag: device
                  value: '{#DEVNAME}'
            - uuid: c3d4e5f6a7b84c9dae1f2a3b4c5d6e7f
              name: 'Device [{#DEVNAME}]: IP address'
              type: TRAP
              key: 'fritzbox.netdev[{#DEVNAME},ip]'
              value_type: TEXT
              description: 'Current IP address of the device'
              tags:
                - tag: component
                  value: netdev
                - tag: device
                  value: '{#DEVNAME}'
            - uuid: e5f6a7b8c9d04e1fab3b4c5d6e7f8a9b
              name: 'Device [{#DEVNAME}]: WLAN RSSI'
              type: TRAP
              key: 'fritzbox.netdev[{#DEVNAME},rssi]'
              units: dBm
              description: 'WLAN signal strength in dBm (WLAN devices only)'
              tags:
                - tag: component
                  value: netdev
                - tag: device
                  value: '{#DEVNAME}'
            - uuid: d4e5f6a7b8c94d0e8f2a3b4c5d6e7f8a
              name: 'Device [{#DEVNAME}]: Speed'
              type: TRAP
              key: 'fritzbox.netdev[{#DEVNAME},speed]'
              value_type: FLOAT
              units: Mbit/s
              description: 'WLAN connection speed in Mbit/s (max of RX/TX from device properties)'
              tags:
                - tag: component
                  value: netdev
                - tag: device
                  value: '{#DEVNAME}'
            - uuid: b2c3d4e5f6a74b8c9d0e1f2a3b4c5d6e
              name: 'Device [{#DEVNAME}]: Connection type'
              type: TRAP
              key: 'fritzbox.netdev[{#DEVNAME},type]'
              value_type: TEXT
              description: 'Connection type: wlan or ethernet'
              tags:
                - tag: component
                  value: netdev
                - tag: device
                  value: '{#DEVNAME}'
      tags:
        - tag: class
          value: network
        - tag: vendor
          value: AVM
      macros:
        - macro: '{$FRITZBOX.CPU_TEMP.HIGH}'
          value: '90'
        - macro: '{$FRITZBOX.CPU_TEMP.WARN}'
          value: '80'
        - macro: '{$FRITZBOX.CPU_USAGE.WARN}'
          value: '80'
        - macro: '{$FRITZBOX.DSL.CRC_ERRORS.THRESHOLD}'
          value: '100'
        - macro: '{$FRITZBOX.DSL.NOISE_MARGIN.MIN}'
          value: '6'
        - macro: '{$FRITZBOX.RAM_USAGE.WARN}'
          value: '85'
        - macro: '{$FRITZBOX.UPTIME.MIN}'
          value: '600'
  triggers:
    - uuid: 59887c14bfd24fb49d6f0ee2d0302ca4
      expression: 'last(/AVM FritzBox TR-064/fritzbox.wan.connection_uptime)<{$FRITZBOX.UPTIME.MIN} and last(/AVM FritzBox TR-064/fritzbox.device.uptime)>{$FRITZBOX.UPTIME.MIN}'
      name: 'FritzBox: WAN reconnected (ISP disconnect)'
      priority: WARNING
      manual_close: 'YES'
      tags:
        - tag: scope
          value: availability
