              parameters:
                - '0.1'
          tags:
            - tag: component
              value: dsl
        - uuid: 982734fc237f4ea9b930e34ec94ff34f
          name: 'DSL: Downstream sync rate'
          type: TRAP
          key: fritzbox.dsl.downstream_curr_rate
          units: kbps
          tags:
            - tag: component
              value: dsl
        - uuid: e19f8a5ef180485f952a24646393e278
