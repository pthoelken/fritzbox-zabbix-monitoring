              value: smarthome
        - uuid: 8be86493ab3649839278bf322d0f555e
          name: 'Device: Firmware'
          type: TRAP
          key: fritzbox.device.firmware
          value_type: TEXT
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - '3600'
          tags:
            - tag: component
              value: device
          triggers:
            - uuid: 808c81cd27a8496ba881ab358d035848
              expression: 'change(/AVM FritzBox TR-064/fritzbox.device.firmware)<>0'
              name: 'FritzBox: Firmware changed to {ITEM.LASTVALUE}'
              priority: INFO
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: notice
        - uuid: fc0aff617a1947daa592e6e88596a6f4
          name: 'Device: Log'
          type: TRAP
          key: fritzbox.device.log
          value_type: TEXT
          tags:
            - tag: component
              value: device
        - uuid: 66acbe0c59c44bba98915340a5d2e2a5
