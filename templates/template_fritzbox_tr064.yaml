    - macro: '{$FRITZBOX.UPTIME.MIN}'
      value: '600'
    - macro: '{$FRITZBOX.CPU_TEMP.WARN}'
      value: '80'
    - macro: '{$FRITZBOX.CPU_TEMP.HIGH}'
      value: '90'
